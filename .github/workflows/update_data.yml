name: Hourly Vulnerability & OSINT Sync

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Branch to target or commit to'
        required: true
        default: 'main'
        type: string
      environment:
        description: 'Environment to run against'
        required: true
        type: choice
        options:
          - staging
          - production
          
permissions:
  contents: write

jobs:
  sync-osint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Run OSINT Sync Engine
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/sync_engine.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "Watcher Sync Bot"
          git config --global user.email "actions@github.com"
          git add docs/data/ data/
          git diff --staged --quiet || (git commit -m "Automated OSINT feed refresh [skip ci]" && git push)
